name: Deploy ESIG Theme to OVH

on:
  push:
    branches: [ "main" ]   # ou "master" si ton repo utilise master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Déploie tout le repo vers le dossier du thème sur OVH
      - name: FTP Deploy to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/wp-content/themes/esig/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/README*
            **/node_modules/**
